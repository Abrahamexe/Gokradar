<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<meta name="theme-color" content="#05090F">
<link rel="icon" type="image/svg+xml" href="{{ url_for('web.static', filename='img/favicon.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ url_for('web.static', filename='css/app.css') }}">
{% block head %}{% endblock %}
</head>
<body class="{% block body_class %}app{% endblock %}">
<a class="skip-link" href="#main">İçeriğe geç</a>
{% block backdrop %}{% endblock %}
{% include "_nav.html" %}
{% block layout %}
<main id="main" class="page{% block main_class %} page--padded{% endblock %}">
  {% block content %}{% endblock %}
</main>
{% endblock %}
<script src="{{ url_for('web.static', filename='js/common.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
